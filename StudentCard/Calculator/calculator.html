<!Doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Calculator</title>

    <!-- Styling -->
    <link rel="stylesheet" href="calculator.css">

    <!-- React, ReactDOM and Babel come from a CDN, and that is what lets this
         page run by simply opening it - no build step and no npm install. -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Plain JavaScript first: the calculator's maths and state logic. -->
    <script src="calculator.js"></script>
</head>
<body>
    <h1 class="page-title">React <span>Calculator</span></h1>
    <p class="page-subtitle">HTML + CSS + JavaScript + React</p>

    <!-- React draws the whole calculator inside this element. -->
    <main id="root"></main>

    <noscript>
        <p class="boot-error">This calculator needs JavaScript to be switched on.</p>
    </noscript>

    <!-- The React part of the page. The type "text/babel" tells the browser to
         run Babel first, which turns the JSX below into real JavaScript. -->
    <script type="text/babel" data-presets="react">
        /* React 18 exposes the hooks on the React object when it is loaded
           from a CDN instead of being imported. */
        const { useReducer, useEffect, useCallback } = React;

        /* The plain JavaScript engine (calculator.js) plus the keypad layout. */
        const {
            INITIAL_STATE, KEYPAD, CLEAR_HISTORY,
            reduce, keyFromKeyboard, displayValue, displayExpression
        } = CalculatorEngine;

        /* One single button of the keypad. */
        function Key({ label, type, name, onPress }) {
            return (
                <button
                    type="button"
                    className={type ? 'key key--' + type : 'key'}
                    aria-label={name}
                    onClick={() => onPress(label)}
                >
                    {label}
                </button>
            );
        }

        /* The display: the pending operation above, the number below. */
        function Display({ state }) {
            return (
                <div className={state.error ? 'display display--error' : 'display'}>
                    <div className="display__expression">{displayExpression(state)}</div>
                    <div className="display__value" aria-live="polite">{displayValue(state)}</div>
                </div>
            );
        }

        /* The list of finished calculations. */
        function History({ entries, onClear }) {
            return (
                <aside className="history">
                    <h2 className="history__title">History</h2>

                    {entries.length === 0
                        ? <p className="history__empty">No calculations yet.</p>
                        : <ol className="history__list">
                            {entries.map((entry, index) => <li key={index}>{entry}</li>)}
                          </ol>}

                    <button
                        type="button"
                        className="history__clear"
                        onClick={onClear}
                        disabled={entries.length === 0}
                    >
                        Clear history
                    </button>
                </aside>
            );
        }

        /* The calculator itself: state, keyboard support and the keypad. */
        function Calculator() {
            /* useReducer(reduce, INITIAL_STATE) keeps the whole state of the
               calculator in one place: dispatch(key) runs the pure reduce()
               function from calculator.js and React re-draws what changed. */
            const [state, dispatch] = useReducer(reduce, INITIAL_STATE);

            /* Every button click and every key press ends up here. */
            const press = useCallback((label) => dispatch(label), []);

            /* Let the physical keyboard drive the calculator too. */
            useEffect(() => {
                function handleKeyDown(event) {
                    const label = keyFromKeyboard(event.key);

                    if (label === null) {
                        return;                  // this key is not a calculator key
                    }
                    event.preventDefault();       // don't scroll / don't submit
                    press(label);
                }

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [press]);

            return (
                <div className="layout">
                    <section className="calculator" aria-label="React calculator">
                        <Display state={state} />

                        <div className="keypad">
                            {KEYPAD.map((key) => (
                                <Key
                                    key={key.label}
                                    label={key.label}
                                    type={key.type}
                                    name={key.name}
                                    onPress={press}
                                />
                            ))}
                        </div>

                        <p className="keypad__hint">
                            Keyboard works too: digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>,
                            <kbd>Enter</kbd> for equals, <kbd>Esc</kbd> for AC,
                            <kbd>Backspace</kbd> to delete.
                        </p>
                    </section>

                    <History
                        entries={state.history}
                        onClear={() => press(CLEAR_HISTORY)}
                    />
                </div>
            );
        }

        /* Draw everything inside <main id="root">. */
        ReactDOM.createRoot(document.getElementById('root')).render(<Calculator />);
    </script>

    <script>
        /* If the CDN could not be reached, React never starts and #root stays
           empty - so we show a friendly message instead of a blank page. */
        window.addEventListener('load', function () {
            var root = document.getElementById('root');
            if (root && root.childElementCount === 0) {
                root.innerHTML = '<p class="boot-error">The calculator could not start. ' +
                    'It loads React from the internet, so check your connection and refresh the page.</p>';
            }
        });
    </script>
</body>
</html>
